    // UTILITAS HELPER (FISHER-YATES SHUFFLE, FORMAT WAKTU, & PENILAIAN RUNTUT)
    // =========================================================================
    function fisherYatesShuffle(array) {
      const cloned = [...array];
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned;
    }

    function prepareExamQuestions(sourceQuestions) {
      const shuffledQs = fisherYatesShuffle(sourceQuestions);
      return shuffledQs.map((q) => {
        if ((q.type === "mc" || q.type === "mc_complex") && Array.isArray(q.options)) {
          return {
            ...q,
            options: fisherYatesShuffle(q.options)
          };
        }
        return { ...q };
      });
    }

    function getTodayDateString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatTimeRemaining(totalSeconds) {
      const safeSec = Math.max(0, totalSeconds);
      const hrs = Math.floor(safeSec / 3600);
      const mins = Math.floor((safeSec % 3600) / 60);
      const secs = safeSec % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function isQuestionAnswered(question, answer) {
      if (answer === undefined || answer === null) return false;
      if (question.type === "mc") {
        return String(answer).trim() !== "";
      }
      if (question.type === "mc_complex") {
        return Array.isArray(answer) && answer.length > 0;
      }
      if (question.type === "short_answer") {
        return String(answer).trim() !== "";
      }
      return false;
    }

    function evaluateExamResults(shuffledQuestions, answersMap) {
      // Urutkan kembali berdasarkan ID nomor soal asli (1 sampai N)
      const orderedQuestions = [...shuffledQuestions].sort((a, b) => a.id - b.id);

      let correctCount = 0;
      let wrongCount = 0;
      let emptyCount = 0;
      const detailsList = [];
      const itemBreakdown = [];

      orderedQuestions.forEach((q) => {
        const userAns = answersMap[q.id];
        const answered = isQuestionAnswered(q, userAns);

        if (!answered) {
          emptyCount += 1;
          detailsList.push(`Soal ${q.id}: KOSONG`);
          itemBreakdown.push({
            id: q.id,
            status: "KOSONG",
            userLabel: "-",
            correctLabel: Array.isArray(q.correctAnswer) ? q.correctAnswer.join(",") : String(q.correctAnswer)
          });
          return;
        }

        let isCorrect = false;
        let userLabel = "";
        let correctLabel = "";

        if (q.type === "mc") {
          userLabel = String(userAns).trim();
          correctLabel = String(q.correctAnswer).trim();
          isCorrect = userLabel.toUpperCase() === correctLabel.toUpperCase();
        } else if (q.type === "mc_complex") {
          const sortedUser = [...userAns].map((v) => String(v).trim().toUpperCase()).sort();
          const sortedKey = [...q.correctAnswer].map((v) => String(v).trim().toUpperCase()).sort();
          userLabel = sortedUser.join(",");
          correctLabel = sortedKey.join(",");
          isCorrect = sortedUser.length === sortedKey.length && sortedUser.every((val, idx) => val === sortedKey[idx]);
        } else if (q.type === "short_answer") {
          userLabel = String(userAns).trim();
          if (Array.isArray(q.correctAnswer)) {
            correctLabel = q.correctAnswer[0];
            isCorrect = q.correctAnswer.some(
              (acc) => String(acc).trim().toLowerCase() === userLabel.toLowerCase()
            );
          } else {
            correctLabel = String(q.correctAnswer).trim();
            isCorrect = userLabel.toLowerCase() === correctLabel.toLowerCase();
          }
        }

        if (isCorrect) {
          correctCount += 1;
          detailsList.push(`Soal ${q.id}: BENAR`);
          itemBreakdown.push({
            id: q.id,
            status: "BENAR",
            userLabel,
            correctLabel
          });
        } else {
          wrongCount += 1;
          detailsList.push(`Soal ${q.id}: SALAH (Pilih: ${userLabel}, Kunci: ${correctLabel})`);
          itemBreakdown.push({
            id: q.id,
            status: "SALAH",
            userLabel,
            correctLabel
          });
        }
      });

      const totalQuestions = orderedQuestions.length;
      const rawScore = totalQuestions > 0 ? (correctCount / totalQuestions) * 100 : 0;
      const finalScore = Number(rawScore.toFixed(2));
      const rincianJawaban = detailsList.join(" | ");

      return {
        skor: finalScore,
        benar: correctCount,
        salah: wrongCount,
        kosong: emptyCount,
        totalSoal: totalQuestions,
        rincianJawaban,
        itemBreakdown
      };
    }

    function requestAppFullscreen() {
      try {
        const elem = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {});
          } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
          } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
          }
        }
      } catch (e) {
        // Abaikan jika browser membatasi fullscreen programmatic
      }
    }

    function exitAppFullscreen() {
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      } catch (e) {
        // Abaikan
      }
    }

    // KOMPONEN CUSTOM MODAL (DI LUAR APP -> ANTI-FLICKER SAAT TIMER BERJALAN)

    function CustomModal({ modalState }) {
      if (!modalState || !modalState.isOpen) return null;

      const {
        type = "alert",
        variant = "warning",
        title,
        message,
        confirmText = "OK",
        cancelText = "Batal",
        onConfirm,
        onCancel
      } = modalState;

      const badgeStyles = {
        warning: "bg-amber-100 text-amber-600 border-amber-200",
        danger: "bg-red-100 text-red-600 border-red-200",
        info: "bg-cyan-100 text-cyan-700 border-cyan-200",
        success: "bg-emerald-100 text-emerald-600 border-emerald-200"
      };

      const btnStyles = {
        warning: "bg-amber-600 hover:bg-amber-700 focus:ring-amber-300",
        danger: "bg-red-600 hover:bg-red-700 focus:ring-red-300",
        info: "bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-700 hover:to-blue-800 focus:ring-cyan-300",
        success: "bg-emerald-600 hover:bg-emerald-700 focus:ring-emerald-300"
      };

      return (
        <div
          className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn"
          role="dialog"
          aria-modal="true"
        >
          <div className="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden transform transition-all">
            <div className="p-6">
              <div className="flex items-start gap-4">
                <div className={`flex-shrink-0 w-12 h-12 rounded-xl border flex items-center justify-center ${badgeStyles[variant] || badgeStyles.warning}`}>
                  <Icon name={variant === "success" ? "check" : variant === "info" ? "send" : "alert"} className="w-6 h-6" />
                </div>
                <div className="flex-1 min-w-0">
                  <h3 className="text-lg font-bold text-slate-900 leading-snug">
                    {title}
                  </h3>
                  <p className="mt-2 text-sm text-slate-600 leading-relaxed whitespace-pre-line">
                    {message}
                  </p>
                </div>
              </div>
            </div>

            <div className="px-6 py-4 bg-slate-50 border-t border-slate-100 flex flex-col-reverse sm:flex-row sm:justify-end gap-2.5">
              {type === "confirm" && (
                <button
                  type="button"
                  onClick={onCancel}
                  className="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-700 font-semibold text-sm hover:bg-slate-100 transition cursor-pointer"
                >
                  {cancelText}
                </button>
              )}
              <button
                type="button"
                onClick={onConfirm}
                className={`w-full sm:w-auto px-5 py-2.5 rounded-xl text-white font-semibold text-sm shadow-md focus:outline-none focus:ring-4 transition cursor-pointer ${btnStyles[variant] || btnStyles.info}`}
              >
                {confirmText}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // KOMPONEN UTAMA APLIKASI CBT (SINGLE PAGE APPLICATION)
    // =========================================================================
    function App() {
      // Status tampilan: 'login' | 'exam' | 'result'
      const [screen, setScreen] = useState("login");

      // Form Identitas Siswa
      const [studentName, setStudentName] = useState("");
      const [studentClass, setStudentClass] = useState("");
      const [examDate, setExamDate] = useState(getTodayDateString);

      // Sesi Tersimpan di LocalStorage
      const [savedSession, setSavedSession] = useState(null);

      // State Pelaksanaan Ujian
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(EXAM_CONFIG.durationMinutes * 60);
      const [violations, setViolations] = useState(0);
      const [isLocked, setIsLocked] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // State Hasil Akhir
      const [examResult, setExamResult] = useState(null);
      const [submitStatus, setSubmitStatus] = useState("idle"); // 'idle' | 'sending' | 'sent' | 'error'
      const [finishReason, setFinishReason] = useState("Selesai Normal");

      // State Custom Modal (Alert / Confirm)
      const [modalState, setModalState] = useState({ isOpen: false });

      // Refs untuk menghindari stale closure di event listener & timer
      const stateRef = useRef({
        screen,
        studentName,
        studentClass,
        examDate,
        questions,
        answers,
        timeLeft,
        violations,
        currentIndex,
        isLocked,
        isSubmitting
      });

      useEffect(() => {
        stateRef.current = {
          screen,
          studentName,
          studentClass,
          examDate,
          questions,
          answers,
          timeLeft,
          violations,
          currentIndex,
          isLocked,
          isSubmitting
        };
      }, [
        screen,
        studentName,
        studentClass,
        examDate,
        questions,
        answers,
        timeLeft,
        violations,
        currentIndex,
        isLocked,
        isSubmitting
      ]);

      const lastViolationTsRef = useRef(0);
      const hasSubmittedRef = useRef(false);

      // 1. Cek LocalStorage saat pertama kali aplikasi dibuka
      useEffect(() => {
        try {
          const rawSaved = localStorage.getItem(STORAGE_KEY);
          if (rawSaved) {
            const parsed = JSON.parse(rawSaved);
            if (
              parsed &&
              parsed.studentInfo &&
              Array.isArray(parsed.shuffledQuestions) &&
              parsed.shuffledQuestions.length > 0 &&
              typeof parsed.timeLeft === "number" &&
              parsed.timeLeft > 0
            ) {
              setSavedSession(parsed);
            } else {
              localStorage.removeItem(STORAGE_KEY);
            }
          }
        } catch (err) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }, []);

      // 2. Auto-Save real-time ke LocalStorage selama ujian berlangsung
      useEffect(() => {
        if (screen !== "exam" || isLocked || hasSubmittedRef.current) return;
        if (!questions || questions.length === 0) return;

        try {
          const payloadToSave = {
            studentInfo: {
              name: studentName,
              className: studentClass,
              examDate: examDate
            },
            shuffledQuestions: questions,
            answers: answers,
            timeLeft: timeLeft,
            violations: violations,
            currentIndex: currentIndex,
            savedAt: new Date().toISOString()
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payloadToSave));
        } catch (err) {
          // Abaikan jika kuota storage penuh
        }
      }, [screen, isLocked, studentName, studentClass, examDate, questions, answers, timeLeft, violations, currentIndex]);

      // 3. Fungsi Finalisasi, Penilaian Runtut, & Kirim ke Google Sheets
      const finalizeAndSubmitExam = useCallback(async (reasonText, overrideViolations = null) => {
        if (hasSubmittedRef.current) return;
        hasSubmittedRef.current = true;

        const current = stateRef.current;
        const finalViolations = overrideViolations !== null ? overrideViolations : current.violations;

        setIsLocked(true);
        setIsSubmitting(true);
        setFinishReason(reasonText);
        setModalState({ isOpen: false });

        const evaluation = evaluateExamResults(current.questions, current.answers);
        setExamResult(evaluation);

        const payload = {
          nama: current.studentName.trim(),
          kelas: current.studentClass.trim(),
          tanggal: current.examDate,
          mataPelajaran: EXAM_CONFIG.subject,
          jenisUjian: EXAM_CONFIG.examType,
          skor: evaluation.skor,
          benar: evaluation.benar,
          salah: evaluation.salah,
          kosong: evaluation.kosong,
          totalSoal: evaluation.totalSoal,
          pelanggaran: finalViolations,
          keterangan: reasonText,
          rincianJawaban: evaluation.rincianJawaban
        };

        setSubmitStatus("sending");

        try {
          if (GOOGLE_SHEETS_WEB_APP_URL && GOOGLE_SHEETS_WEB_APP_URL !== "URL_APPS_SCRIPT_ANDA") {
            await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
              method: "POST",
              mode: "no-cors",
              headers: {
                "Content-Type": "text/plain"
              },
              body: JSON.stringify(payload)
            });
          }
          setSubmitStatus("sent");
        } catch (err) {
          setSubmitStatus("error");
        } finally {
          // Hapus data sesi dari LocalStorage setelah ujian berhasil disubmit
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch (e) {}
          setSavedSession(null);
          setIsSubmitting(false);
          setScreen("result");
          exitAppFullscreen();
        }
      }, []);

      // 4. Timer Hitung Mundur Otomatis
      useEffect(() => {
        if (screen !== "exam" || isLocked || hasSubmittedRef.current) return;

        const timerId = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timerId);
              setTimeout(() => {
                finalizeAndSubmitExam("Auto-Submit: Waktu Ujian Habis");
              }, 0);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerId);
      }, [screen, isLocked, finalizeAndSubmitExam]);

      // 5. Sistem Keamanan Strict Anti-Cheat (Visibility, Fullscreen, Copy/Paste/Right-Click)
      useEffect(() => {
        if (screen !== "exam" || isLocked) return;

        const triggerSecurityViolation = (sourceLabel) => {
          if (hasSubmittedRef.current || stateRef.current.isLocked) return;

          // Debounce 900ms agar peristiwa ganda (misal keluar fullscreen + pindah tab bersamaan) terhitung 1x
          const now = Date.now();
          if (now - lastViolationTsRef.current < 900) return;
          lastViolationTsRef.current = now;

          const nextViolationCount = stateRef.current.violations + 1;
          setViolations(nextViolationCount);

          if (nextViolationCount === 1) {
            setModalState({
              isOpen: true,
              type: "alert",
              variant: "danger",
              title: "PERINGATAN PELANGGARAN KEAMANAN (1/2)!",
              message: `Sistem mendeteksi aktivitas terlarang (${sourceLabel}).\n\nAnda dilarang meninggalkan halaman ujian atau keluar dari mode layar penuh (Fullscreen).\n\nJika Anda melakukan pelanggaran 1 kali lagi, lembar ujian akan DIKUNCI dan DIKUMPULKAN OTOMATIS!`,
              confirmText: "Kembali ke Layar Penuh & Lanjutkan",
              onConfirm: () => {
                setModalState({ isOpen: false });
                requestAppFullscreen();
              }
            });
          } else if (nextViolationCount >= 2) {
            finalizeAndSubmitExam(
              `Auto-Submit: Pelanggaran Keamanan 2x (${sourceLabel})`,
              nextViolationCount
            );
          }
        };

        const handleVisibilityChange = () => {
          if (document.hidden) {
            triggerSecurityViolation("Berpindah Tab / Meminimalkan Layar");
          }
        };

        const handleFullscreenChange = () => {
          const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
          if (!isFs) {
            triggerSecurityViolation("Keluar dari Mode Layar Penuh (Fullscreen)");
          }
        };

        const handleContextMenu = (e) => {
          e.preventDefault();
        };

        const handleCopyCutPaste = (e) => {
          const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        };

        const handleSelectStart = (e) => {
          const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          if (tag !== "input" && tag !== "textarea") {
            e.preventDefault();
          }
        };

        const handleKeyDown = (e) => {
          const key = e.key ? e.key.toLowerCase() : "";
          const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : "";
          const isInput = tag === "input" || tag === "textarea";

          if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(key)) ||
            (e.ctrlKey && ["u", "s", "p"].includes(key)) ||
            (!isInput && e.ctrlKey && ["c", "x", "v", "a"].includes(key))
          ) {
            e.preventDefault();
          }
        };

        document.addEventListener("visibilitychange", handleVisibilityChange);
        document.addEventListener("fullscreenchange", handleFullscreenChange);
        document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
        document.addEventListener("contextmenu", handleContextMenu);
        document.addEventListener("copy", handleCopyCutPaste);
        document.addEventListener("cut", handleCopyCutPaste);
        document.addEventListener("paste", handleCopyCutPaste);
        document.addEventListener("selectstart", handleSelectStart);
        document.addEventListener("keydown", handleKeyDown);

        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          document.removeEventListener("fullscreenchange", handleFullscreenChange);
          document.removeEventListener("webkitfullscreenchange", handleFullscreenChange);
          document.removeEventListener("contextmenu", handleContextMenu);
          document.removeEventListener("copy", handleCopyCutPaste);
          document.removeEventListener("cut", handleCopyCutPaste);
          document.removeEventListener("paste", handleCopyCutPaste);
          document.removeEventListener("selectstart", handleSelectStart);
          document.removeEventListener("keydown", handleKeyDown);
        };
      }, [screen, isLocked, finalizeAndSubmitExam]);

      // =======================================================================
      // HANDLER AKSI PENGGUNA
      // =======================================================================
      const handleStartNewExam = (e) => {
        e.preventDefault();
        if (!studentName.trim() || !studentClass.trim() || !examDate) {
          setModalState({
            isOpen: true,
            type: "alert",
            variant: "warning",
            title: "Data Identitas Belum Lengkap",
            message: "Silakan lengkapi Nama Lengkap, Kelas, dan Tanggal Ujian terlebih dahulu sebelum memulai ujian.",
            confirmText: "Mengerti",
            onConfirm: () => setModalState({ isOpen: false })
          });
          return;
        }

        hasSubmittedRef.current = false;
        lastViolationTsRef.current = Date.now();

        const prepared = prepareExamQuestions(rawQuestionsData);
        const initialSeconds = EXAM_CONFIG.durationMinutes * 60;

        setQuestions(prepared);
        setAnswers({});
        setCurrentIndex(0);
        setTimeLeft(initialSeconds);
        setViolations(0);
        setIsLocked(false);
        setIsSubmitting(false);
        setSavedSession(null);

        requestAppFullscreen();
        setScreen("exam");
      };

      const handleResumeSavedSession = () => {
        if (!savedSession) return;

        hasSubmittedRef.current = false;
        lastViolationTsRef.current = Date.now();

        setStudentName(savedSession.studentInfo.name || "");
        setStudentClass(savedSession.studentInfo.className || "");
        setExamDate(savedSession.studentInfo.examDate || getTodayDateString());
        setQuestions(savedSession.shuffledQuestions || []);
        setAnswers(savedSession.answers || {});
        setTimeLeft(savedSession.timeLeft || EXAM_CONFIG.durationMinutes * 60);
        setViolations(savedSession.violations || 0);
        setCurrentIndex(savedSession.currentIndex || 0);
        setIsLocked(false);
        setIsSubmitting(false);

        requestAppFullscreen();
        setScreen("exam");
      };

      const handleClearSavedSession = () => {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        setSavedSession(null);
      };

      const handleSelectMcOption = (questionId, optionOrigId) => {
        if (isLocked) return;
        setAnswers((prev) => ({
          ...prev,
          [questionId]: optionOrigId
        }));
      };

      const handleToggleComplexOption = (questionId, optionOrigId) => {
        if (isLocked) return;
        setAnswers((prev) => {
          const existing = Array.isArray(prev[questionId]) ? prev[questionId] : [];
          const exists = existing.includes(optionOrigId);
          const updated = exists
            ? existing.filter((item) => item !== optionOrigId)
            : [...existing, optionOrigId];
          return {
            ...prev,
            [questionId]: updated
          };
        });
      };

      const handleShortAnswerChange = (questionId, value) => {
        if (isLocked) return;
        setAnswers((prev) => ({
          ...prev,
          [questionId]: value
        }));
      };

      const handleRequestManualFinish = () => {
        const total = questions.length;
        const answeredCount = questions.filter((q) => isQuestionAnswered(q, answers[q.id])).length;
        const unansweredCount = total - answeredCount;

        setModalState({
          isOpen: true,
          type: "confirm",
          variant: unansweredCount > 0 ? "warning" : "info",
          title: "Konfirmasi Kumpulkan Ujian",
          message:
            unansweredCount > 0
              ? `Anda telah menjawab ${answeredCount} dari ${total} soal.\nMasih ada ${unansweredCount} soal yang BELUM DIJAWAB.\n\nApakah Anda yakin ingin mengakhiri dan mengumpulkan ujian sekarang?`
              : `Seluruh ${total} soal telah Anda jawab dengan lengkap.\n\nApakah Anda yakin ingin mengumpulkan jawaban ujian sekarang?`,
          confirmText: "Ya, Selesai & Kumpulkan",
          cancelText: "Periksa Kembali",
          onConfirm: () => {
            finalizeAndSubmitExam("Selesai Normal");
          },
          onCancel: () => {
            setModalState({ isOpen: false });
          }
        });
      };

      // Statistik cepat saat ujian berlangsung
      const answeredTotalCount = useMemo(() => {
        return questions.filter((q) => isQuestionAnswered(q, answers[q.id])).length;
      }, [questions, answers]);

      const currentQuestion = questions[currentIndex] || null;
      const optionLabels = ["A", "B", "C", "D", "E", "F"];

      // =======================================================================
      // RENDER TAMPILAN
      // =======================================================================
      return (
        <div className={`min-h-screen flex flex-col ${screen === "exam" ? "exam-protected" : ""}`}>
          {/* Custom Modal Global (Alert & Confirm) */}
          <CustomModal modalState={modalState} />

          {/* HEADER APLIKASI ELEGAN & RESPONSIF */}
          <header className="bg-slate-950/35 backdrop-blur-md border-b border-white/15 text-white shadow-lg sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center gap-3.5">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-md border border-white/25 flex-shrink-0">
                  <Icon name="book" className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-base sm:text-xl font-extrabold tracking-tight leading-tight text-white">
                    {EXAM_CONFIG.subject}
                  </h1>
                  <p className="text-xs sm:text-sm font-medium text-cyan-100/90 mt-0.5">
                    {EXAM_CONFIG.examType} &bull; KELAS {EXAM_CONFIG.grade}
                  </p>
                </div>
              </div>

              {/* Status Bar Kanan Header saat Ujian Berlangsung */}
              {screen === "exam" && (
                <div className="flex flex-wrap items-center gap-2 sm:gap-3">
                  <div className="px-3 py-1.5 rounded-xl bg-white/10 border border-white/15 text-xs sm:text-sm flex items-center gap-2">
                    <Icon name="user" className="w-4 h-4 text-cyan-200" />
                    <span className="font-semibold truncate max-w-[140px] sm:max-w-[200px]">
                      {studentName}
                    </span>
                    <span className="text-cyan-200">({studentClass})</span>
                  </div>

                  <div
                    className={`px-3 py-1.5 rounded-xl border text-xs sm:text-sm font-bold flex items-center gap-1.5 ${
                      violations > 0
                        ? "bg-red-500/30 border-red-300/50 text-red-100"
                        : "bg-emerald-500/20 border-emerald-300/30 text-emerald-100"
                    }`}
                  >
                    <Icon name="shield" className="w-4 h-4" />
                    <span>Pelanggaran: {violations}/2</span>
                  </div>

                  <div
                    className={`px-3.5 py-1.5 rounded-xl border font-mono text-sm sm:text-base font-extrabold flex items-center gap-2 shadow-inner ${
                      timeLeft <= 300
                        ? "bg-red-600 border-red-300 text-white animate-pulse"
                        : "bg-slate-900/70 border-cyan-300/30 text-cyan-200"
                    }`}
                  >
                    <Icon name="clock" className="w-4 h-4" />
                    <span>{formatTimeRemaining(timeLeft)}</span>
                  </div>
                </div>
              )}
            </div>
          </header>

          {/* ================================================================= */}
          {/* HALAMAN 1: LOGIN & DETEKSI SESI TERSIMPAN                        */}
          {/* ================================================================= */}
          {screen === "login" && (
            <main className="flex-1 flex items-center justify-center p-4 sm:p-6">
              <div className="w-full max-w-xl space-y-5">
                {/* Banner Sesi Ujian Tersimpan (Auto-Save Recovery) */}
                {savedSession && (
                  <div className="bg-amber-50/95 backdrop-blur-md border-2 border-amber-400 rounded-2xl p-5 shadow-2xl">
                    <div className="flex items-start gap-3.5">
                      <div className="w-11 h-11 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center flex-shrink-0 border border-amber-300">
                        <Icon name="alert" className="w-6 h-6" />
                      </div>
                      <div className="flex-1">
                        <h2 className="text-base sm:text-lg font-extrabold text-amber-950">
                          Sesi Ujian Tersimpan Ditemukan!
                        </h2>
                        <p className="text-xs sm:text-sm text-amber-800 mt-1 leading-relaxed">
                          Ditemukan progres ujian atas nama{" "}
                          <strong>{savedSession.studentInfo.name}</strong> (Kelas{" "}
                          <strong>{savedSession.studentInfo.className}</strong>) dengan sisa waktu{" "}
                          <strong>{formatTimeRemaining(savedSession.timeLeft)}</strong> dan{" "}
                          <strong>
                            {
                              savedSession.shuffledQuestions.filter((q) =>
                                isQuestionAnswered(q, savedSession.answers?.[q.id])
                              ).length
                            }
                            /{savedSession.shuffledQuestions.length}
                          </strong>{" "}
                          soal terjawab.
                        </p>
                        <div className="mt-4 flex flex-col sm:flex-row gap-2.5">
                          <button
                            type="button"
                            onClick={handleResumeSavedSession}
                            className="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold text-sm shadow-md transition cursor-pointer"
                          >
                            <Icon name="play" className="w-4 h-4" />
                            <span>Lanjutkan Ujian</span>
                          </button>
                          <button
                            type="button"
                            onClick={handleClearSavedSession}
                            className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-white hover:bg-red-50 text-red-700 border border-red-300 font-semibold text-sm transition cursor-pointer"
                          >
                            <Icon name="refresh" className="w-4 h-4" />
                            <span>Mulai Ulang (Hapus Progres)</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Kartu Login Peserta Ujian */}
                <div className="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-white/40 overflow-hidden">
                  <div className="bg-gradient-to-r from-cyan-700 via-sky-700 to-blue-800 px-6 py-5 text-white">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="inline-block px-2.5 py-0.5 rounded-full bg-white/15 text-cyan-100 text-xs font-semibold tracking-wide uppercase">
                          Computer-Based Test (CBT)
                        </span>
                        <h2 className="text-xl sm:text-2xl font-extrabold mt-1">
                          Identitas Peserta Ujian
                        </h2>
                      </div>
                      <div className="text-right text-xs text-cyan-100 space-y-0.5">
                        <div className="font-bold text-white text-sm">{rawQuestionsData.length} Soal</div>
                        <div>{EXAM_CONFIG.durationMinutes} Menit</div>
                      </div>
                    </div>
                  </div>

                  <form onSubmit={handleStartNewExam} className="p-6 sm:p-7 space-y-5">
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-1.5">
                        Nama Lengkap Peserta <span className="text-red-500">*</span>
                      </label>
                      <div className="relative">
                        <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
                          <Icon name="user" className="w-5 h-5" />
                        </span>
                        <input
                          type="text"
                          required
                          value={studentName}
                          onChange={(e) => setStudentName(e.target.value)}
                          placeholder="Masukkan nama lengkap sesuai absensi..."
                          className="allow-input-select w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white text-slate-900 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1.5">
                          Kelas <span className="text-red-500">*</span>
                        </label>
                        <div className="relative">
                          <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
                            <Icon name="layers" className="w-5 h-5" />
                          </span>
                          <input
                            type="text"
                            required
                            value={studentClass}
                            onChange={(e) => setStudentClass(e.target.value)}
                            placeholder="Contoh: IX-A"
                            className="allow-input-select w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white text-slate-900 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1.5">
                          Tanggal Ujian <span className="text-red-500">*</span>
                        </label>
                        <div className="relative">
                          <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
                            <Icon name="calendar" className="w-5 h-5" />
                          </span>
                          <input
                            type="date"
                            required
                            value={examDate}
                            onChange={(e) => setExamDate(e.target.value)}
                            className="allow-input-select w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white text-slate-900 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
                          />
                        </div>
                      </div>
                    </div>

                    {/* Kotak Tata Tertib & Anti-Kecurangan */}
                    <div className="rounded-2xl bg-cyan-50 border border-cyan-200 p-4 text-xs text-slate-700 space-y-1.5">
                      <div className="font-bold text-cyan-900 flex items-center gap-1.5 text-sm">
                        <Icon name="shield" className="w-4 h-4 text-cyan-700" />
                        <span>Tata Tertib & Sistem Keamanan Ujian:</span>
                      </div>
                      <ul className="list-disc pl-5 space-y-1 text-slate-600 leading-relaxed">
                        <li>Ujian otomatis berjalan dalam mode <strong>Layar Penuh (Fullscreen)</strong>.</li>
                        <li>Urutan soal dan pilihan jawaban diacak secara otomatis untuk setiap peserta.</li>
                        <li>Dilarang berpindah tab, membuka aplikasi lain, klik kanan, atau keluar dari Fullscreen.</li>
                        <li><strong>Pelanggaran ke-2</strong> akan mengunci ujian dan mengirimkan nilai secara otomatis.</li>
                      </ul>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-cyan-600 via-sky-600 to-blue-700 hover:from-cyan-700 hover:via-sky-700 hover:to-blue-800 text-white font-extrabold text-base shadow-lg hover:shadow-xl transform active:scale-[0.99] transition flex items-center justify-center gap-2.5 cursor-pointer"
                    >
                      <Icon name="fullscreen" className="w-5 h-5" />
                      <span>Mulai Ujian</span>
                    </button>
                  </form>
                </div>
              </div>
            </main>
          )}

          {/* ================================================================= */}
          {/* HALAMAN 2: ANTARMUKA PENGERJAAN UJIAN (EXAM UI)                   */}
          {/* ================================================================= */}
          {screen === "exam" && currentQuestion && (
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                {/* KOLOM KIRI / TENGAH: AREA SOAL & OPSI JAWABAN */}
                <section className="lg:col-span-8 bg-white/95 backdrop-blur-md rounded-3xl shadow-xl border border-white/50 overflow-hidden flex flex-col">
                  {/* Bar Informasi Nomor Soal */}
                  <div className="px-6 py-4 bg-slate-50 border-b border-slate-200/80 flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2.5">
                      <span className="px-3.5 py-1 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-700 text-white font-extrabold text-sm shadow-sm">
                        Soal No. {currentIndex + 1}
                      </span>
                      <span className="text-xs font-semibold text-slate-500">
                        dari {questions.length} soal
                      </span>
                    </div>

                    <span className="px-3 py-1 rounded-lg bg-cyan-100/80 text-cyan-900 text-xs font-bold">
                      {currentQuestion.type === "mc" && "Pilihan Ganda"}
                      {currentQuestion.type === "mc_complex" && "Pilihan Ganda Kompleks (Pilih Lebih dari Satu)"}
                      {currentQuestion.type === "short_answer" && "Isian Singkat"}
                    </span>
                  </div>

                  {/* Isi Pertanyaan */}
                  <div className="p-6 sm:p-7 space-y-6">
                    {/* Gambar Soal jika tersedia */}
                    {currentQuestion.image && (
                      <div className="rounded-2xl overflow-hidden border border-slate-200 bg-slate-100 max-w-lg">
                        <img
                          src={currentQuestion.image}
                          alt={`Ilustrasi Soal ${currentIndex + 1}`}
                          className="w-full h-auto object-contain"
                        />
                      </div>
                    )}

                    {/* Teks Soal (mendukung teks biasa, teks Arab, & HTML Tabel Tailwind) */}
                    <div
                      className="text-slate-800 text-base sm:text-[17px] leading-relaxed font-medium"
                      dangerouslySetInnerHTML={{ __html: currentQuestion.question }}
                    />

                    {/* OPSI JAWABAN: PILIHAN GANDA BIASA (mc) */}
                    {currentQuestion.type === "mc" && Array.isArray(currentQuestion.options) && (
                      <div className="space-y-3 pt-1">
                        {currentQuestion.options.map((opt, idx) => {
                          const isSelected = answers[currentQuestion.id] === opt.id;
                          const displayLetter = optionLabels[idx] || String(idx + 1);

                          return (
                            <button
                              key={opt.id}
                              type="button"
                              disabled={isLocked}
                              onClick={() => handleSelectMcOption(currentQuestion.id, opt.id)}
                              className={`w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start gap-3.5 cursor-pointer ${
                                isSelected
                                  ? "border-blue-600 bg-blue-50/90 shadow-md"
                                  : "border-slate-200 bg-white hover:border-cyan-400 hover:bg-cyan-50/40"
                              }`}
                            >
                              <span
                                className={`w-8 h-8 rounded-xl flex items-center justify-center font-extrabold text-sm flex-shrink-0 transition ${
                                  isSelected
                                    ? "bg-blue-600 text-white shadow-sm"
                                    : "bg-slate-100 text-slate-700 border border-slate-300"
                                }`}
                              >
                                {displayLetter}
                              </span>
                              <span
                                className={`pt-1 text-sm sm:text-base leading-relaxed ${
                                  isSelected ? "font-bold text-blue-950" : "font-medium text-slate-700"
                                }`}
                                dangerouslySetInnerHTML={{ __html: opt.text }}
                              />
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {/* OPSI JAWABAN: PILIHAN GANDA KOMPLEKS (mc_complex) */}
                    {currentQuestion.type === "mc_complex" && Array.isArray(currentQuestion.options) && (
                      <div className="space-y-3 pt-1">
                        <p className="text-xs font-semibold text-cyan-800 bg-cyan-50 px-3 py-2 rounded-xl border border-cyan-200">
                          Petunjuk: Centang seluruh pernyataan/jawaban yang Anda anggap benar.
                        </p>
                        {currentQuestion.options.map((opt, idx) => {
                          const selectedList = Array.isArray(answers[currentQuestion.id])
                            ? answers[currentQuestion.id]
                            : [];
                          const isChecked = selectedList.includes(opt.id);
                          const displayLetter = optionLabels[idx] || String(idx + 1);

                          return (
                            <button
                              key={opt.id}
                              type="button"
                              disabled={isLocked}
                              onClick={() => handleToggleComplexOption(currentQuestion.id, opt.id)}
                              className={`w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start gap-3.5 cursor-pointer ${
                                isChecked
                                  ? "border-blue-600 bg-blue-50/90 shadow-md"
                                  : "border-slate-200 bg-white hover:border-cyan-400 hover:bg-cyan-50/40"
                              }`}
                            >
                              <span
                                className={`w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5 border-2 transition ${
                                  isChecked
                                    ? "bg-blue-600 border-blue-600 text-white"
                                    : "bg-white border-slate-300 text-transparent"
                                }`}
                              >
                                <Icon name="check" className="w-4 h-4" />
                              </span>
                              <span className="font-bold text-slate-500 pt-0.5 text-sm">
                                {displayLetter}.
                              </span>
                              <span
                                className={`pt-0.5 text-sm sm:text-base leading-relaxed ${
                                  isChecked ? "font-bold text-blue-950" : "font-medium text-slate-700"
                                }`}
                                dangerouslySetInnerHTML={{ __html: opt.text }}
                              />
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {/* OPSI JAWABAN: ISIAN SINGKAT (short_answer) */}
                    {currentQuestion.type === "short_answer" && (
                      <div className="pt-2 space-y-2">
                        <label className="block text-sm font-bold text-slate-700">
                          Ketik Jawaban Singkat Anda:
                        </label>
                        <input
                          type="text"
                          disabled={isLocked}
                          value={answers[currentQuestion.id] || ""}
                          onChange={(e) => handleShortAnswerChange(currentQuestion.id, e.target.value)}
                          placeholder="Tulis jawaban singkat di sini..."
                          className="allow-input-select w-full px-4 py-3.5 rounded-2xl border-2 border-slate-300 focus:border-blue-600 focus:ring-4 focus:ring-blue-100 bg-slate-50 focus:bg-white text-slate-900 font-semibold text-base outline-none transition"
                        />
                      </div>
                    )}
                  </div>

                  {/* Footer Tombol Navigasi Soal */}
                  <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
                    <button
                      type="button"
                      disabled={currentIndex === 0 || isLocked}
                      onClick={() => setCurrentIndex((prev) => Math.max(0, prev - 1))}
                      className={`inline-flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-sm border transition ${
                        currentIndex === 0 || isLocked
                          ? "border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed"
                          : "border-slate-300 bg-white text-slate-700 hover:bg-slate-100 shadow-sm cursor-pointer"
                      }`}
                    >
                      <Icon name="chevronLeft" className="w-4 h-4" />
                      <span>Sebelumnya</span>
                    </button>

                    <div className="flex flex-wrap items-center gap-2.5 ml-auto">
                      {currentIndex < questions.length - 1 ? (
                        <button
                          type="button"
                          disabled={isLocked}
                          onClick={() =>
                            setCurrentIndex((prev) => Math.min(questions.length - 1, prev + 1))
                          }
                          className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-700 hover:to-blue-800 text-white font-bold text-sm shadow-md transition cursor-pointer"
                        >
                          <span>Selanjutnya</span>
                          <Icon name="chevronRight" className="w-4 h-4" />
                        </button>
                      ) : (
                        <button
                          type="button"
                          disabled={isLocked}
                          onClick={handleRequestManualFinish}
                          className="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold text-sm shadow-lg transition cursor-pointer"
                        >
                          <Icon name="send" className="w-4 h-4" />
                          <span>Selesai & Kumpulkan</span>

                  <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                    <h2 className="font-extrabold text-slate-800 text-sm sm:text-base">
                      Navigasi Nomor Soal
                    </h2>
                    <span className="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 font-bold text-xs">
                      {answeredTotalCount} / {questions.length} Dijawab
                    </span>
                  </div>

                  {/* Grid Kotak Nomor Soal */}
                  <div className="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-2 max-h-[340px] overflow-y-auto p-1">
                    {questions.map((q, idx) => {
                      const answered = isQuestionAnswered(q, answers[q.id]);
                      const isActive = idx === currentIndex;

                      return (
                        <button
                          key={q.id}
                          type="button"
                          disabled={isLocked}
                          onClick={() => setCurrentIndex(idx)}
                          className={`h-10 rounded-xl font-bold text-xs sm:text-sm border transition-all flex items-center justify-center cursor-pointer ${
                            answered
                              ? "bg-emerald-500 text-white border-emerald-600 hover:bg-emerald-600 shadow-sm"
                              : "bg-slate-100 text-slate-700 border-slate-300 hover:bg-slate-200"
                          } ${isActive ? "ring-4 ring-blue-500 ring-offset-1 scale-105 z-10" : ""}`}
                        >
                          {idx + 1}
                        </button>
                      );
                    })}
                  </div>

                  {/* Legenda Status Kotak Nomor */}
                  <div className="pt-3 border-t border-slate-200 grid grid-cols-3 gap-2 text-[11px] font-semibold text-slate-600">
                    <div className="flex items-center gap-1.5">
                      <span className="w-3.5 h-3.5 rounded bg-emerald-500 border border-emerald-600 inline-block"></span>
                      <span>Dijawab</span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <span className="w-3.5 h-3.5 rounded bg-slate-100 border border-slate-300 inline-block"></span>
                      <span>Kosong</span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <span className="w-3.5 h-3.5 rounded bg-white ring-2 ring-blue-500 inline-block"></span>
                      <span>Aktif</span>
                    </div>
                  </div>
                </aside>
              </div>
            </main>
          )}

          {/* ================================================================= */}
          {/* HALAMAN 3: HASIL NILAI & REKAP PENYELESAIAN UJIAN                 */}
          {/* ================================================================= */}
          {screen === "result" && examResult && (
            <main className="flex-1 flex items-center justify-center p-4 sm:p-6">
              <div className="w-full max-w-3xl bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-white/50 overflow-hidden">
                {/* Header Nilai */}
                <div className="bg-gradient-to-r from-cyan-700 via-sky-700 to-blue-800 px-6 py-7 text-center text-white">
                  <div className="w-16 h-16 mx-auto rounded-2xl bg-white/15 border border-white/25 flex items-center justify-center mb-3 shadow-lg">
                    <Icon name="award" className="w-9 h-9 text-amber-300" />
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">
                    Ujian Telah Selesai!
                  </h2>
                  <p className="text-cyan-100 text-sm mt-1">
                    {EXAM_CONFIG.subject} &bull; {EXAM_CONFIG.examType}
                  </p>
                </div>

                <div className="p-6 sm:p-8 space-y-6">
                  {/* Status Pengiriman ke Google Sheets */}
                  <div
                    className={`p-3.5 rounded-2xl border text-xs sm:text-sm font-semibold flex items-center justify-between gap-3 ${
                      submitStatus === "sent"
                        ? "bg-emerald-50 border-emerald-200 text-emerald-800"
                        : submitStatus === "sending"
                        ? "bg-cyan-50 border-cyan-200 text-cyan-800"
                        : "bg-amber-50 border-amber-200 text-amber-800"
                    }`}
                  >
                    <div className="flex items-center gap-2">
                      <Icon name="check" className="w-5 h-5 flex-shrink-0" />
                      <span>
                        {submitStatus === "sent" && "Data hasil ujian berhasil dikirim ke server Google Sheets."}
                        {submitStatus === "sending" && "Sedang mengirim hasil ujian ke server..."}
                        {submitStatus === "error" && "Koneksi server terganggu, namun rekap nilai lokal telah tersimpan."}
                      </span>
                    </div>
                    <span className="px-2.5 py-1 rounded-lg bg-white/80 text-xs font-bold border border-black/5">
                      {finishReason}
                    </span>
                  </div>

                  {/* Kartu Skor Utama & Identitas */}
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-5 items-center">
                    <div className="md:col-span-5 rounded-2xl bg-gradient-to-br from-cyan-50 to-blue-100 border-2 border-cyan-200 p-6 text-center">
                      <div className="text-xs font-extrabold uppercase tracking-wider text-cyan-800">
                        Nilai Akhir Anda
                      </div>
                      <div className="text-5xl sm:text-6xl font-black text-blue-900 my-2">
                        {examResult.skor}
                      </div>
                      <div className="text-xs font-semibold text-slate-600">
                        Skala Maksimal 100
                      </div>
                    </div>

                    <div className="md:col-span-7 space-y-3">
                      <div className="rounded-2xl bg-slate-50 border border-slate-200 p-4 space-y-2 text-sm">
                        <div className="flex justify-between">
                          <span className="text-slate-500">Nama Peserta</span>
                          <span className="font-bold text-slate-900">{studentName}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Kelas</span>
                          <span className="font-bold text-slate-900">{studentClass}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Tanggal Ujian</span>
                          <span className="font-bold text-slate-900">{examDate}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-500">Catatan Pelanggaran</span>
                          <span className={`font-bold ${violations > 0 ? "text-red-600" : "text-emerald-600"}`}>
                            {violations} kali
                          </span>
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-2.5 text-center">
                        <div className="rounded-xl bg-emerald-50 border border-emerald-200 p-2.5">
                          <div className="text-lg font-extrabold text-emerald-700">{examResult.benar}</div>
                          <div className="text-[11px] font-bold text-emerald-800">Benar</div>
                        </div>
                        <div className="rounded-xl bg-red-50 border border-red-200 p-2.5">
                          <div className="text-lg font-extrabold text-red-700">{examResult.salah}</div>
                          <div className="text-[11px] font-bold text-red-800">Salah</div>
                        </div>
                        <div className="rounded-xl bg-slate-100 border border-slate-200 p-2.5">
                          <div className="text-lg font-extrabold text-slate-700">{examResult.kosong}</div>
                          <div className="text-[11px] font-bold text-slate-600">Kosong</div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Ringkasan Analisis Butir Soal Runtut (No 1 - 50) */}
                  <div className="space-y-2">
                    <h3 className="text-sm font-extrabold text-slate-800">
                      Analisis Butir Soal Runtut (No. 1 &ndash; {examResult.totalSoal})
                    </h3>
                    <div className="max-h-48 overflow-y-auto rounded-2xl border border-slate-200 bg-slate-50 p-3 grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
                      {examResult.itemBreakdown.map((item) => (
                        <div
                          key={item.id}
                          className={`px-2.5 py-1.5 rounded-lg border font-semibold flex items-center justify-between ${
                            item.status === "BENAR"
                              ? "bg-emerald-50 border-emerald-200 text-emerald-800"
                              : item.status === "SALAH"
                              ? "bg-red-50 border-red-200 text-red-800"
                              : "bg-white border-slate-200 text-slate-500"
                          }`}
                        >
                          <span>#{item.id}</span>
                          <span>
                            {item.status === "BENAR"
                              ? "BENAR"
                              : item.status === "SALAH"
                              ? `${item.userLabel} (${item.correctLabel})`
                              : "KOSONG"}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
