    // =========================================================================
    // HELPER: FISHER-YATES SHUFFLE & FORMAT WAKTU
    // =========================================================================
    function fisherYatesShuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function prepareShuffledExam(questions) {
      const optionLetters = ['A', 'B', 'C', 'D', 'E', 'F'];
      const shuffledQuestions = fisherYatesShuffle(questions);
      return shuffledQuestions.map((q) => {
        if (q.type === 'mc' || q.type === 'mc_complex') {
          const shuffledOpts = fisherYatesShuffle(q.options || []).map((opt, idx) => ({
            ...opt,
            displayKey: optionLetters[idx] || String(idx + 1)
          }));
          return { ...q, shuffledOptions: shuffledOpts };
        }
        return { ...q };
      });
    }

    function formatTime(totalSeconds) {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function getTodayDateString() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const localDate = new Date(now.getTime() - offset * 60 * 1000);
      return localDate.toISOString().split('T')[0];
    }

              <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />

        case 'refresh':

            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
              <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />

        default:

      if (!isOpen) return null;

      const isDanger = type === 'danger';
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200 animate-fadeIn">
            <div className={`px-6 py-4 flex items-center gap-3 ${isDanger ? 'bg-red-600 text-white' : 'bg-amber-500 text-white'}`}>
              <Icon name="alert" className="w-7 h-7 shrink-0" />
              <h3 className="text-lg font-bold tracking-tight">{title}</h3>
            </div>
            <div className="p-6">
              <p className="text-slate-700 text-sm sm:text-base leading-relaxed whitespace-pre-line">
                {message}

              <div className="mt-6 flex justify-end">
                <button
                  type="button"
                  onClick={onClose}
                  className={`px-5 py-2.5 rounded-xl font-semibold text-white shadow-md transition active:scale-95 ${
                    isDanger
                      ? 'bg-red-600 hover:bg-red-700'
                      : 'bg-sky-600 hover:bg-sky-700'
                  }`}

                  {buttonText}

            </div>

      return (

          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
            <div className={`px-6 py-4 flex items-center gap-3 ${isDanger ? 'bg-red-600 text-white' : 'bg-sky-700 text-white'}`}>
              <Icon name={isDanger ? 'alert' : 'checkCircle'} className="w-6 h-6 shrink-0" />
              <h3 className="text-lg font-bold tracking-tight">{title}</h3>

            <div className="p-6">
              <p className="text-slate-700 text-sm sm:text-base leading-relaxed whitespace-pre-line">
                {message}

              <div className="mt-6 flex items-center justify-end gap-3">

                  type="button"

                  {cancelText}

                <button

                  onClick={onConfirm}
                  className={`px-5 py-2.5 rounded-xl font-semibold text-white shadow-md transition active:scale-95 ${
                    isDanger

    // =========================================================================
    // APLIKASI UTAMA (SPA)
    // =========================================================================
    function App() {
      // Tahapan layar: 'login' | 'exam' | 'result'
      const [stage, setStage] = useState('login');

      // Form Login
      const [nama, setNama] = useState('');
      const [kelas, setKelas] = useState('');
      const [tanggal, setTanggal] = useState(getTodayDateString());

      // Sesi Tersimpan di LocalStorage
      const [savedSession, setSavedSession] = useState(null);

      // State Ujian
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState({}); // { [questionId]: 'A' | ['A','B'] | 'teks' }
      const [timeLeft, setTimeLeft] = useState(EXAM_CONFIG.durationMinutes * 60);
      const [violations, setViolations] = useState(0);

      // Hasil Akhir Ujian
      const [examResult, setExamResult] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      // Custom Modals State
      const [alertModal, setAlertModal] = useState({
        isOpen: false,
        title: '',
        message: '',
        type: 'warning',
        buttonText: 'Saya Mengerti',
        onCloseCallback: null
      });

      const [confirmModal, setConfirmModal] = useState({
        isOpen: false,
        title: '',
        message: '',
        confirmText: 'Ya, Lanjutkan',
        cancelText: 'Batal',
        isDanger: false,
        onConfirmCallback: null
      });

      // Refs untuk akses sinkron pada event listener & timer tanpa stale closure
      const stageRef = useRef(stage);
      const violationsRef = useRef(violations);
      const answersRef = useRef(answers);
      const questionsRef = useRef(questions);
      const studentRef = useRef({ nama, kelas, tanggal });
      const isSubmittingRef = useRef(false);
      const lastViolationTimestampRef = useRef(0);
      const ignoreFullscreenGraceRef = useRef(false);

      useEffect(() => { stageRef.current = stage; }, [stage]);
      useEffect(() => { violationsRef.current = violations; }, [violations]);
      useEffect(() => { answersRef.current = answers; }, [answers]);
      useEffect(() => { questionsRef.current = questions; }, [questions]);
      useEffect(() => { studentRef.current = { nama, kelas, tanggal }; }, [nama, kelas, tanggal]);

      // 1. Cek LocalStorage saat aplikasi pertama kali dibuka
      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.student && Array.isArray(parsed.questions) && parsed.questions.length > 0) {
              setSavedSession(parsed);
            }
          }
        } catch (err) {
          console.error("Gagal membaca sesi tersimpan:", err);
        }
      }, []);

      // 2. Auto-Save ke LocalStorage setiap ada perubahan progres selama ujian berlangsung
      useEffect(() => {
        if (stage !== 'exam' || isSubmittingRef.current) return;
        try {
          const payloadToSave = {
            student: { nama, kelas, tanggal },
            questions,
            currentIndex,
            answers,
            timeLeft,
            violations,
            updatedAt: new Date().toISOString()
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payloadToSave));
        } catch (err) {
          console.error("Gagal menyimpan ke LocalStorage:", err);
        }
      }, [stage, nama, kelas, tanggal, questions, currentIndex, answers, timeLeft, violations]);

      // Helper Fullscreen
      const requestAppFullscreen = useCallback(() => {
        const elem = document.documentElement;
        if (!document.fullscreenElement && elem.requestFullscreen) {
          ignoreFullscreenGraceRef.current = true;
          elem.requestFullscreen()
            .catch(() => {})
            .finally(() => {
              setTimeout(() => {
                ignoreFullscreenGraceRef.current = false;
              }, 600);
            });
        }
      }, []);

      const exitAppFullscreen = useCallback(() => {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }, []);

      // 3. Fungsi Penilaian Runtut & Pengiriman ke Google Sheets
      const finalizeAndSubmitExam = useCallback(async (reasonText, overrideViolations = null) => {
        if (isSubmittingRef.current) return;
        isSubmittingRef.current = true;
        setIsSubmitting(true);

        // Tutup modal yang mungkin terbuka
        setAlertModal((prev) => ({ ...prev, isOpen: false }));
        setConfirmModal((prev) => ({ ...prev, isOpen: false }));

        const currentQuestions = questionsRef.current;
        const currentAnswers = answersRef.current;
        const currentStudent = studentRef.current;
        const finalViolations = overrideViolations !== null ? overrideViolations : violationsRef.current;

        // Urutkan soal kembali berdasarkan nomor ID asli (1 sampai N)
        const sortedQuestions = [...currentQuestions].sort((a, b) => a.id - b.id);

        let correctCount = 0;
        let wrongCount = 0;
        let emptyCount = 0;
        const detailStrings = [];
        const detailItems = [];

        sortedQuestions.forEach((q) => {
          const userAns = currentAnswers[q.id];

          if (q.type === 'mc') {
            if (!userAns || userAns === '') {
              emptyCount++;
              detailStrings.push(`Soal ${q.id}: KOSONG`);
              detailItems.push({ id: q.id, status: 'KOSONG', userAns: '-', key: q.answer });
            } else if (userAns === q.answer) {
              correctCount++;
              detailStrings.push(`Soal ${q.id}: BENAR`);
              detailItems.push({ id: q.id, status: 'BENAR', userAns, key: q.answer });
            } else {
              wrongCount++;
              detailStrings.push(`Soal ${q.id}: SALAH (Pilih: ${userAns}, Kunci: ${q.answer})`);
              detailItems.push({ id: q.id, status: 'SALAH', userAns, key: q.answer });
            }
          } else if (q.type === 'mc_complex') {
            const arrUser = Array.isArray(userAns) ? [...userAns].sort() : [];
            const arrKey = Array.isArray(q.answer) ? [...q.answer].sort() : [];
            if (arrUser.length === 0) {
              emptyCount++;
              detailStrings.push(`Soal ${q.id}: KOSONG`);
              detailItems.push({ id: q.id, status: 'KOSONG', userAns: '-', key: arrKey.join(',') });
            } else if (JSON.stringify(arrUser) === JSON.stringify(arrKey)) {
              correctCount++;
              detailStrings.push(`Soal ${q.id}: BENAR`);
              detailItems.push({ id: q.id, status: 'BENAR', userAns: arrUser.join(','), key: arrKey.join(',') });
            } else {
              wrongCount++;
              detailStrings.push(`Soal ${q.id}: SALAH (Pilih: ${arrUser.join(',')}, Kunci: ${arrKey.join(',')})`);
              detailItems.push({ id: q.id, status: 'SALAH', userAns: arrUser.join(','), key: arrKey.join(',') });
            }
          } else if (q.type === 'short') {
            const strUser = typeof userAns === 'string' ? userAns.trim() : '';
            const strKey = String(q.answer || '').trim();
            if (!strUser) {
              emptyCount++;
              detailStrings.push(`Soal ${q.id}: KOSONG`);
              detailItems.push({ id: q.id, status: 'KOSONG', userAns: '-', key: strKey });
            } else if (strUser.toLowerCase() === strKey.toLowerCase()) {
              correctCount++;
              detailStrings.push(`Soal ${q.id}: BENAR`);
              detailItems.push({ id: q.id, status: 'BENAR', userAns: strUser, key: strKey });
            } else {
              wrongCount++;
              detailStrings.push(`Soal ${q.id}: SALAH (Pilih: ${strUser}, Kunci: ${strKey})`);
              detailItems.push({ id: q.id, status: 'SALAH', userAns: strUser, key: strKey });
            }
          }
        });

        const totalQuestions = sortedQuestions.length;
        const rawScore = totalQuestions > 0 ? (correctCount / totalQuestions) * 100 : 0;
        const finalScore = Number.isInteger(rawScore) ? rawScore : Number(rawScore.toFixed(2));
        const rincianJawaban = detailStrings.join(' | ');

        const submissionPayload = {
          nama: currentStudent.nama,
          kelas: currentStudent.kelas,
          tanggal: currentStudent.tanggal,
          skor: finalScore,
          pelanggaran: finalViolations,
          keterangan: reasonText,
          rincianJawaban: rincianJawaban,
          mapel: EXAM_CONFIG.subject,
          jenisUjian: EXAM_CONFIG.examType,
          jumlahBenar: correctCount,
          jumlahSalah: wrongCount,
          jumlahKosong: emptyCount,
          totalSoal: totalQuestions
        };

        // Kirim data ke Google Sheets menggunakan mode no-cors & text/plain
        let syncStatus = 'Terkirim ke Server Google Sheets';
        try {
          if (GOOGLE_SHEETS_WEB_APP_URL && GOOGLE_SHEETS_WEB_APP_URL !== "URL_APPS_SCRIPT_ANDA") {
            await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: {
                'Content-Type': 'text/plain'
              },
              body: JSON.stringify(submissionPayload)
            });
          } else {
            syncStatus = 'Mode Lokal (URL Apps Script belum diatur)';
          }
        } catch (error) {
          console.error("Error saat mengirim ke Google Sheets:", error);
          syncStatus = 'Gagal terhubung ke server (Nilai tersimpan di layar)';
        }

        // Hapus data dari LocalStorage setelah submit berhasil diproses
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {}

        exitAppFullscreen();

        setExamResult({
          ...submissionPayload,
          detailItems,
          syncStatus
        });
        setStage('result');
        setIsSubmitting(false);
      }, [exitAppFullscreen]);

      // 4. Timer Hitung Mundur
      useEffect(() => {
        if (stage !== 'exam') return;

        const timerId = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timerId);
              finalizeAndSubmitExam("Waktu Habis (Auto-Submit)");
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerId);
      }, [stage, finalizeAndSubmitExam]);

      // 5. Sistem Keamanan Anti-Kecurangan (Anti-Copy, Anti-RightClick, Visibility & Fullscreen)
      useEffect(() => {
        if (stage !== 'exam') return;

        const triggerViolation = (sourceReason) => {
          if (isSubmittingRef.current || stageRef.current !== 'exam') return;

          // Debounce 800ms agar satu aksi (misal Alt+Tab yang memicu fullscreenchange + visibilitychange)
          // tidak terhitung ganda secara bersamaan
          const now = Date.now();
          if (now - lastViolationTimestampRef.current < 800) return;
          lastViolationTimestampRef.current = now;

          const nextCount = violationsRef.current + 1;
          violationsRef.current = nextCount;
          setViolations(nextCount);

          if (nextCount === 1) {
            setAlertModal({
              isOpen: true,
              type: 'warning',
              title: 'PERINGATAN PELANGGARAN KE-1!',
              message: `Sistem mendeteksi Anda ${sourceReason}.\n\nIni adalah peringatan pertama dan terakhir. Jika Anda kembali keluar dari mode layar penuh (Fullscreen) atau berpindah tab/aplikasi untuk kedua kalinya, ujian akan otomatis dikunci dan dikumpulkan!`,
              buttonText: 'Kembali ke Mode Layar Penuh',
              onCloseCallback: () => {
                requestAppFullscreen();
              }
            });
          } else if (nextCount >= 2) {
            finalizeAndSubmitExam(`Pelanggaran Batas Maksimal (${nextCount}x - ${sourceReason})`, nextCount);
          }
        };

        const handleVisibilityChange = () => {
          if (document.hidden) {
            triggerViolation("berpindah tab atau meminimalkan jendela browser");
          }
        };

        const handleFullscreenChange = () => {
          if (!document.fullscreenElement && !ignoreFullscreenGraceRef.current) {
            triggerViolation("keluar dari mode layar penuh (Fullscreen)");
          }
        };

        const handleContextMenu = (e) => {
          e.preventDefault();
        };

        const handleCopyCutPaste = (e) => {
          e.preventDefault();
        };

        const handleKeyDown = (e) => {
          // Blokir shortcut inspect/copy/view-source
          if (
            (e.ctrlKey && ['c', 'v', 'x', 'u', 's', 'p', 'a'].includes(e.key.toLowerCase())) ||
            (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase())) ||
            e.key === 'F12'
          ) {
            e.preventDefault();
          }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('contextmenu', handleContextMenu);
        document.addEventListener('copy', handleCopyCutPaste);
        document.addEventListener('cut', handleCopyCutPaste);
        document.addEventListener('paste', handleCopyCutPaste);
        document.addEventListener('keydown', handleKeyDown);

        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
          document.removeEventListener('contextmenu', handleContextMenu);
          document.removeEventListener('copy', handleCopyCutPaste);
          document.removeEventListener('cut', handleCopyCutPaste);
          document.removeEventListener('paste', handleCopyCutPaste);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, [stage, finalizeAndSubmitExam, requestAppFullscreen]);

      // Handler Mulai Ujian Baru
      const handleStartNewExam = (e) => {
        e.preventDefault();
        const trimmedNama = nama.trim();
        const trimmedKelas = kelas.trim();

        if (!trimmedNama || !trimmedKelas || !tanggal) {
          setAlertModal({
            isOpen: true,
            type: 'warning',
            title: 'Data Identitas Belum Lengkap',
            message: 'Harap isi Nama Lengkap, Kelas, dan Tanggal Ujian terlebih dahulu sebelum memulai ujian.',
            buttonText: 'Lengkapi Data',
            onCloseCallback: null
          });
          return;
        }

        const shuffled = prepareShuffledExam(rawQuestionsData);
        const initialTime = EXAM_CONFIG.durationMinutes * 60;

        isSubmittingRef.current = false;
        violationsRef.current = 0;
        lastViolationTimestampRef.current = Date.now();

        setNama(trimmedNama);
        setKelas(trimmedKelas);
        setQuestions(shuffled);
        setCurrentIndex(0);
        setAnswers({});
        setTimeLeft(initialTime);
        setViolations(0);
        setSavedSession(null);

        requestAppFullscreen();
        setStage('exam');
      };

      // Handler Lanjutkan Sesi dari LocalStorage
      const handleResumeSession = () => {
        if (!savedSession) return;
        isSubmittingRef.current = false;
        violationsRef.current = savedSession.violations || 0;
        lastViolationTimestampRef.current = Date.now();

        setNama(savedSession.student.nama);
        setKelas(savedSession.student.kelas);
        setTanggal(savedSession.student.tanggal);
        setQuestions(savedSession.questions);
        setCurrentIndex(savedSession.currentIndex || 0);
        setAnswers(savedSession.answers || {});
        setTimeLeft(savedSession.timeLeft || EXAM_CONFIG.durationMinutes * 60);
        setViolations(savedSession.violations || 0);

        requestAppFullscreen();
        setStage('exam');
      };

      // Handler Hapus Progres Tersimpan
      const handleResetSavedSession = () => {
        setConfirmModal({
          isOpen: true,
          isDanger: true,
          title: 'Hapus Progres Tersimpan?',
          message: 'Seluruh jawaban dan sisa waktu dari sesi sebelumnya akan dihapus permanen. Anda akan memulai ulang dari awal.',
          confirmText: 'Ya, Hapus Progres',
          cancelText: 'Batal',
          onConfirmCallback: () => {
            try {
              localStorage.removeItem(STORAGE_KEY);
            } catch (e) {}
            setSavedSession(null);
            setConfirmModal((prev) => ({ ...prev, isOpen: false }));
          }
        });
      };

      // Handler Memilih Jawaban
      const handleSelectSingleOption = (questionId, origKey) => {
        setAnswers((prev) => ({
          ...prev,
          [questionId]: origKey
        }));
      };

      const handleToggleComplexOption = (questionId, origKey) => {
        setAnswers((prev) => {
          const currentArr = Array.isArray(prev[questionId]) ? prev[questionId] : [];
          if (currentArr.includes(origKey)) {
            return {
              ...prev,
              [questionId]: currentArr.filter((k) => k !== origKey)
            };
          } else {
            return {
              ...prev,
              [questionId]: [...currentArr, origKey]
            };
          }
        });
      };

      const handleShortAnswerChange = (questionId, value) => {
        setAnswers((prev) => ({
          ...prev,
          [questionId]: value
        }));
      };

      // Cek apakah sebuah soal sudah dijawab
      const isQuestionAnswered = (q) => {
        const val = answers[q.id];
        if (q.type === 'mc_complex') return Array.isArray(val) && val.length > 0;
        if (q.type === 'short') return typeof val === 'string' && val.trim().length > 0;
        return Boolean(val);
      };

      // Konfirmasi Sebelum Kumpulkan Ujian
      const handleRequestSubmit = () => {
        const answeredCount = questions.filter((q) => isQuestionAnswered(q)).length;
        const unansweredCount = questions.length - answeredCount;

        const message =
          unansweredCount > 0
            ? `Anda telah menjawab ${answeredCount} dari ${questions.length} soal.\nMasih ada ${unansweredCount} soal yang BELUM DIJAWAB.\n\nApakah Anda yakin ingin mengakhiri ujian dan mengumpulkan jawaban sekarang?`
            : `Selamat! Anda telah menjawab seluruh (${questions.length}) soal.\n\nApakah Anda yakin ingin mengakhiri ujian dan mengirimkan jawaban ke server?`;

        setConfirmModal({
          isOpen: true,
          isDanger: false,
          title: 'Konfirmasi Pengumpulan Ujian',
          message,
          confirmText: 'Ya, Kumpulkan Sekarang',
          cancelText: 'Periksa Kembali',
          onConfirmCallback: () => {
            finalizeAndSubmitExam("Selesai Dikerjakan Siswa");
          }
        });
      };

      const currentQuestion = questions[currentIndex] || null;
      const answeredTotal = questions.filter((q) => isQuestionAnswered(q)).length;

      return (
        <div className={`min-h-screen flex flex-col ${stage === 'exam' ? 'no-select' : ''}`}>
          {/* HEADER UTAMA */}
          <AppHeader
            student={{ nama, kelas, tanggal }}
            timeLeft={timeLeft}
            violations={violations}
            isExamActive={stage === 'exam'}
          />

          {/* KONTEN UTAMA BERDASARKAN TAHAPAN */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
            {/* ==================== 1. HALAMAN LOGIN ==================== */}
            {stage === 'login' && (
              <div className="max-w-xl mx-auto">
                {/* Banner Sesi Tersimpan di LocalStorage */}
                {savedSession && (
                  <div className="mb-6 bg-amber-50 border-2 border-amber-400 rounded-2xl p-5 shadow-xl">
                    <div className="flex items-start gap-3.5">
                      <div className="p-2.5 bg-amber-500 text-white rounded-xl shrink-0">
                        <Icon name="refresh" className="w-6 h-6" />
                      </div>
                      <div className="flex-1">
                        <h2 className="text-base sm:text-lg font-extrabold text-amber-900">
                          Sesi Ujian Tersimpan Ditemukan!
                        </h2>
                        <p className="text-xs sm:text-sm text-amber-800 mt-1">
                          Peserta: <strong>{savedSession.student.nama}</strong> ({savedSession.student.kelas}) &bull; Sisa Waktu: <strong>{formatTime(savedSession.timeLeft)}</strong>
                        </p>
                        <div className="mt-4 flex flex-wrap gap-2.5">
                          <button
                            type="button"
                            onClick={handleResumeSession}
                            className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow transition active:scale-95"
                          >
                            Lanjutkan Ujian
                          </button>
                          <button
                            type="button"
                            onClick={handleResetSavedSession}
                            className="px-4 py-2 rounded-xl bg-white hover:bg-red-50 text-red-700 border border-red-300 font-semibold text-sm transition active:scale-95"
                          >
                            Mulai Ulang (Hapus Progres)
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Card Login Peserta */}
                <div className="bg-white rounded-2xl shadow-2xl border border-sky-100 overflow-hidden">
                  <div className="bg-gradient-to-r from-sky-800 to-blue-900 px-6 py-5 text-white">
                    <h2 className="text-lg sm:text-xl font-bold">Identitas Peserta Ujian</h2>
                    <p className="text-xs sm:text-sm text-cyan-200 mt-0.5">
                      Durasi: {EXAM_CONFIG.durationMinutes} Menit &bull; Jumlah Soal: {rawQuestionsData.length} Butir
                    </p>
                  </div>

                  <form onSubmit={handleStartNewExam} className="p-6 space-y-5">
                    <div>
                      <label className="block text-sm font-bold text-slate-700 mb-1.5">
                        Nama Lengkap <span className="text-red-500">*</span>
                      </label>
                      <input
                        type="text"
                        value={nama}
                        onChange={(e) => setNama(e.target.value)}
                        placeholder="Masukkan nama lengkap sesuai absen..."
                        className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-sky-600 focus:ring-2 focus:ring-sky-200 outline-none transition text-slate-900 font-medium"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1.5">
                          Kelas <span className="text-red-500">*</span>
                        </label>
                        <input
                          type="text"
                          value={kelas}
                          onChange={(e) => setKelas(e.target.value)}
                          placeholder="Contoh: IX-A"
                          className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-sky-600 focus:ring-2 focus:ring-sky-200 outline-none transition text-slate-900 font-medium"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1.5">
                          Tanggal Ujian <span className="text-red-500">*</span>
                        </label>
                        <input
                          type="date"
                          value={tanggal}
                          onChange={(e) => setTanggal(e.target.value)}
                          className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-sky-600 focus:ring-2 focus:ring-sky-200 outline-none transition text-slate-900 font-medium"
                        />
                      </div>
                    </div>

                    {/* Peraturan Ujian */}
                    <div className="bg-sky-50 border border-sky-200 rounded-xl p-4 text-xs sm:text-sm text-sky-900 space-y-1.5">
                      <p className="font-bold flex items-center gap-1.5 text-sky-950">
                        <Icon name="shield" className="w-4 h-4 text-sky-700" />
                        Tata Tertib & Sistem Keamanan CBT:
                      </p>
                      <ul className="list-disc pl-5 space-y-1 text-slate-700">
                        <li>Ujian akan berjalan otomatis dalam mode <strong>Layar Penuh (Fullscreen)</strong>.</li>
                        <li>Dilarang keluar dari layar penuh, berpindah tab, atau membuka aplikasi lain.</li>
                        <li><strong>Pelanggaran ke-1</strong> mendapat peringatan keras; <strong>Pelanggaran ke-2</strong> otomatis mengunci & mengumpulkan ujian.</li>
                      </ul>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 text-white font-extrabold text-base shadow-lg hover:shadow-xl transition transform active:scale-[0.99] flex items-center justify-center gap-2"
                    >
                      <span>Mulai Ujian</span>
                      <Icon name="chevronRight" className="w-5 h-5" />
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* ==================== 2. HALAMAN UJIAN (EXAM UI) ==================== */}
            {stage === 'exam' && currentQuestion && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                {/* AREA SOAL & OPSI JAWABAN (KIRI / TENGAH) */}
                <div className="lg:col-span-8 bg-white rounded-2xl shadow-xl border border-sky-100 overflow-hidden">
                  {/* Bar Nomor Soal */}
                  <div className="bg-slate-50 border-b border-slate-200 px-5 sm:px-6 py-3.5 flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <span className="px-3 py-1 rounded-lg bg-sky-700 text-white font-extrabold text-sm">
                        Soal No. {currentIndex + 1}
                      </span>
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">
                        {currentQuestion.type === 'mc' && 'Pilihan Ganda'}
                        {currentQuestion.type === 'mc_complex' && 'Pilihan Ganda Kompleks'}
                        {currentQuestion.type === 'short' && 'Isian Singkat'}
                      </span>
                    </div>
                    <span className="text-xs sm:text-sm font-semibold text-slate-500">
                      {currentIndex + 1} dari {questions.length}
                    </span>
                  </div>

                  {/* Isi Pertanyaan */}
                  <div className="p-5 sm:p-7">
                    {currentQuestion.image && (
                      <div className="mb-5 rounded-xl overflow-hidden border border-slate-200 bg-slate-50 p-2">
                        <img
                          src={currentQuestion.image}
                          alt={`Ilustrasi Soal ${currentIndex + 1}`}
                          className="max-h-72 mx-auto rounded-lg object-contain"
                        />
                      </div>
                    )}

                    <div
                      className="text-slate-800 text-base sm:text-lg leading-relaxed font-medium mb-6"
                      dangerouslySetInnerHTML={{ __html: currentQuestion.question }}
                    />

                    {/* OPSI JAWABAN: PILIHAN GANDA BIASA (type: 'mc') */}
                    {currentQuestion.type === 'mc' && (
                      <div className="space-y-3">
                        {currentQuestion.shuffledOptions.map((opt) => {
                          const isSelected = answers[currentQuestion.id] === opt.origKey;
                          return (
                            <button
                              key={opt.origKey}
                              type="button"
                              onClick={() => handleSelectSingleOption(currentQuestion.id, opt.origKey)}
                              className={`w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3.5 ${
                                isSelected
                                  ? 'border-sky-600 bg-sky-50/90 shadow-sm'
                                  : 'border-slate-200 hover:border-sky-300 hover:bg-slate-50'
                              }`}
                            >
                              <span
                                className={`w-8 h-8 rounded-lg flex items-center justify-center font-extrabold text-sm shrink-0 transition ${
                                  isSelected
                                    ? 'bg-sky-600 text-white'
                                    : 'bg-slate-100 text-slate-700'
                                }`}
                              >
                                {opt.displayKey}
                              </span>
                              <span
                                className={`pt-1 text-sm sm:text-base leading-snug ${
                                  isSelected ? 'text-sky-950 font-semibold' : 'text-slate-700'
                                }`}
                                dangerouslySetInnerHTML={{ __html: opt.text }}
                              />
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {/* OPSI JAWABAN: PILIHAN GANDA KOMPLEKS (type: 'mc_complex') */}
                    {currentQuestion.type === 'mc_complex' && (
                      <div className="space-y-3">
                        <p className="text-xs font-semibold text-sky-700 mb-2">
                          * Pilih lebih dari satu jawaban yang benar:
                        </p>
                        {currentQuestion.shuffledOptions.map((opt) => {
                          const selectedList = Array.isArray(answers[currentQuestion.id])
                            ? answers[currentQuestion.id]
                            : [];
                          const isChecked = selectedList.includes(opt.origKey);
                          return (
                            <button
                              key={opt.origKey}
                              type="button"
                              onClick={() => handleToggleComplexOption(currentQuestion.id, opt.origKey)}
                              className={`w-full text-left p-4 rounded-xl border-2 transition flex items-start gap-3.5 ${
                                isChecked
                                  ? 'border-sky-600 bg-sky-50/90 shadow-sm'
                                  : 'border-slate-200 hover:border-sky-300 hover:bg-slate-50'
                              }`}
                            >
                              <span
                                className={`w-7 h-7 rounded-md border-2 flex items-center justify-center shrink-0 mt-0.5 transition ${
                                  isChecked
                                    ? 'bg-sky-600 border-sky-600 text-white'
                                    : 'border-slate-300 bg-white'
                                }`}
                              >
                                {isChecked && <Icon name="check" className="w-4 h-4" />}
                              </span>
                              <span
                                className={`text-sm sm:text-base leading-snug ${
                                  isChecked ? 'text-sky-950 font-semibold' : 'text-slate-700'
                                }`}
                                dangerouslySetInnerHTML={{ __html: opt.text }}
                              />
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {/* OPSI JAWABAN: ISIAN SINGKAT (type: 'short') */}
                    {currentQuestion.type === 'short' && (
                      <div className="mt-2">
                        <label className="block text-sm font-bold text-slate-700 mb-2">
                          Ketik Jawaban Singkat Anda:
                        </label>
                        <input
                          type="text"
                          value={answers[currentQuestion.id] || ''}
                          onChange={(e) => handleShortAnswerChange(currentQuestion.id, e.target.value)}
                          placeholder="Tulis jawaban di sini..."
                          className="w-full px-4 py-3.5 rounded-xl border-2 border-slate-300 focus:border-sky-600 focus:ring-2 focus:ring-sky-200 outline-none text-slate-900 font-semibold text-base select-text"
                        />
                      </div>
                    )}
                  </div>

                  {/* TOMBOL NAVIGASI BAWAH */}
                  <div className="bg-slate-50 border-t border-slate-200 px-5 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-3">
                    <button
                      type="button"
                      disabled={currentIndex === 0}
                      onClick={() => setCurrentIndex((prev) => Math.max(0, prev - 1))}
                      className={`px-4 py-2.5 rounded-xl font-bold text-sm flex items-center gap-1.5 transition ${
                        currentIndex === 0
                          ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                          : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 active:scale-95'
                      }`}
                    >
                      <Icon name="chevronLeft" className="w-4 h-4" />
                      <span>Sebelumnya</span>
                    </button>

                    <div className="flex items-center gap-2.5 ml-auto">
                      {currentIndex < questions.length - 1 ? (
                        <button
                          type="button"
                          onClick={() => setCurrentIndex((prev) => Math.min(questions.length - 1, prev + 1))}
                          className="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm shadow flex items-center gap-1.5 transition active:scale-95"
                        >
                          <span>Selanjutnya</span>
                          <Icon name="chevronRight" className="w-4 h-4" />
                        </button>
                      ) : (
                        <button
                          type="button"
                          onClick={handleRequestSubmit}
                          disabled={isSubmitting}
                          className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-lg flex items-center gap-2 transition active:scale-95"
                        >
                          <Icon name="send" className="w-4 h-4" />
                          <span>{isSubmitting ? 'Mengirim...' : 'Selesai & Kumpulkan'}</span>
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* NAVIGASI KOTAK NOMOR SOAL (KANAN / BAWAH) */}
                <div className="lg:col-span-4 bg-white rounded-2xl shadow-xl border border-sky-100 p-5 sticky top-24">
                  <div className="flex items-center justify-between pb-3 mb-4 border-b border-slate-200">
                    <div className="flex items-center gap-2 font-bold text-slate-800">
                      <Icon name="grid" className="w-5 h-5 text-sky-600" />
                      <span>Navigasi Soal</span>
                    </div>
                    <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">
                      Terjawab: {answeredTotal}/{questions.length}
                    </span>
                  </div>

                  {/* Grid Nomor */}
                  <div className="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-2 max-h-[360px] overflow-y-auto p-1">
                    {questions.map((q, idx) => {
                      const answered = isQuestionAnswered(q);
                      const isActive = idx === currentIndex;
                      return (
                        <button
                          key={q.id}
                          type="button"
                          onClick={() => setCurrentIndex(idx)}
                          className={`h-10 rounded-lg font-bold text-sm border transition flex items-center justify-center ${
                            answered
                              ? 'bg-emerald-500 text-white border-emerald-600 hover:bg-emerald-600'
                              : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                          } ${isActive ? 'ring-4 ring-blue-500 ring-offset-1 scale-105 z-10' : ''}`}
                        >
                          {idx + 1}
                        </button>
                      );
                    })}
                  </div>

                  {/* Legenda Warna */}
                  <div className="mt-5 pt-4 border-t border-slate-200 grid grid-cols-3 gap-2 text-xs text-slate-600">
                    <div className="flex items-center gap-1.5">
                      <span className="w-3.5 h-3.5 rounded bg-emerald-500 inline-block shrink-0"></span>
                      <span>Dijawab</span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <span className="w-3.5 h-3.5 rounded bg-white border border-slate-300 inline-block shrink-0"></span>
                      <span>Kosong</span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <span className="w-3.5 h-3.5 rounded bg-white ring-2 ring-blue-500 inline-block shrink-0"></span>
                      <span>Aktif</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==================== 3. HALAMAN NILAI / SELESAI ==================== */}
            {stage === 'result' && examResult && (
              <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-2xl border border-sky-100 overflow-hidden">
                <div className="bg-gradient-to-r from-emerald-600 to-teal-700 px-6 py-7 text-white text-center">
                  <div className="w-16 h-16 rounded-full bg-white/20 mx-auto flex items-center justify-center mb-3">
                    <Icon name="checkCircle" className="w-10 h-10 text-white" />
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-extrabold">Ujian Telah Selesai!</h2>
                  <p className="text-emerald-100 text-sm mt-1">{examResult.syncStatus}</p>
                </div>

                <div className="p-6 sm:p-8">
                  {/* Skor Besar */}
                  <div className="text-center bg-sky-50 border border-sky-200 rounded-2xl p-6 mb-6">
                    <p className="text-xs font-bold uppercase tracking-wider text-sky-700">
                      Nilai Akhir Anda
                    </p>
                    <div className="text-5xl sm:text-6xl font-extrabold text-sky-900 my-2">
                      {examResult.skor}
                    </div>
                    <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-sky-200 text-sky-900">
                      {examResult.keterangan}
                    </span>
                  </div>

                  {/* Ringkasan Identitas & Statistik */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 text-sm">
                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 space-y-1.5">
                      <p className="text-slate-500">Nama Peserta: <strong className="text-slate-900">{examResult.nama}</strong></p>
                      <p className="text-slate-500">Kelas: <strong className="text-slate-900">{examResult.kelas}</strong></p>
                      <p className="text-slate-500">Tanggal: <strong className="text-slate-900">{examResult.tanggal}</strong></p>
                      <p className="text-slate-500">Pelanggaran: <strong className={examResult.pelanggaran > 0 ? 'text-red-600' : 'text-emerald-600'}>{examResult.pelanggaran} kali</strong></p>
                    </div>

                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 grid grid-cols-3 gap-2 text-center items-center">
                      <div>
                        <div className="text-2xl font-extrabold text-emerald-600">{examResult.jumlahBenar}</div>
                        <div className="text-xs font-semibold text-slate-500">Benar</div>
                      </div>
                      <div>
                        <div className="text-2xl font-extrabold text-red-600">{examResult.jumlahSalah}</div>
                        <div className="text-xs font-semibold text-slate-500">Salah</div>
                      </div>
                      <div>
                        <div className="text-2xl font-extrabold text-slate-600">{examResult.jumlahKosong}</div>
                        <div className="text-xs font-semibold text-slate-500">Kosong</div>
                      </div>
                    </div>
                  </div>

                  {/* Rincian Analisis Butir Soal Runtut (No 1 - 50) */}
                  <div>
                    <h3 className="text-sm font-extrabold text-slate-800 uppercase tracking-wider mb-3">
                      Rincian Analisis Jawaban (Urutan Nomor Asli 1 - {examResult.totalSoal})
                    </h3>
                    <div className="max-h-72 overflow-y-auto rounded-xl border border-slate-200 divide-y divide-slate-100 text-xs sm:text-sm">
                      {examResult.detailItems.map((item) => (
                        <div key={item.id} className="px-4 py-2.5 flex items-center justify-between hover:bg-slate-50">
                          <span className="font-bold text-slate-700">Soal {item.id}</span>
                          {item.status === 'BENAR' && (
                            <span className="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-bold">
                              BENAR
                            </span>
                          )}
                          {item.status === 'SALAH' && (
                            <span className="px-2.5 py-0.5 rounded-full bg-red-100 text-red-800 font-bold">
                              SALAH (Pilih: {item.userAns}, Kunci: {item.key})
                            </span>
                          )}
                          {item.status === 'KOSONG' && (
                            <span className="px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-700 font-bold">
                              KOSONG
                            </span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* CUSTOM MODALS (DIDEFINISIKAN DI LUAR APP AGAR TIDAK BERKEDIP) */}
          <AlertModal
            isOpen={alertModal.isOpen}
            title={alertModal.title}
            message={alertModal.message}
            type={alertModal.type}
            buttonText={alertModal.buttonText}
            onClose={() => {
              const cb = alertModal.onCloseCallback;
              setAlertModal((prev) => ({ ...prev, isOpen: false, onCloseCallback: null }));
              if (cb) cb();
            }}
          />

          <ConfirmModal
            isOpen={confirmModal.isOpen}
            title={confirmModal.title}
            message={confirmModal.message}
            confirmText={confirmModal.confirmText}
            cancelText={confirmModal.cancelText}
            isDanger={confirmModal.isDanger}
            onConfirm={() => {
              const cb = confirmModal.onConfirmCallback;
              setConfirmModal((prev) => ({ ...prev, isOpen: false, onConfirmCallback: null }));
              if (cb) cb();
            }}
            onCancel={() => {
              setConfirmModal((prev) => ({ ...prev, isOpen: false, onConfirmCallback: null }));
            }}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
